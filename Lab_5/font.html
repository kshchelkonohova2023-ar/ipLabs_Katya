<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboto Font Example</title>

    <!-- Підключення шрифту Roboto з Google Fonts -->
   <!--  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=
swap" rel="stylesheet"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Bitcount Ink", sans-serif;
            /* Використання шрифту Roboto */
        }

        h1 {
            font-weight: 700;
            /* Напівжирний варіант шрифту */
        }

        p {
            font-weight: 400;
            /* Звичайний варіант шрифту */
        }
    </style>
</head>

<body>
    <h1>Заголовок з шрифтом Roboto</h1>
    <p>Це приклад використання шрифту Roboto, завантаженого з Google
        Fonts.</p>

</body>

</html>
